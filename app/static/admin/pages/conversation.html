<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok2API - 会话管理</title>
  <link rel="icon" href="/static/common/img/favicon/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-mono/style.css" rel="stylesheet">
  <link href="/static/common/css/common.css?v=0.3.1" rel="stylesheet">
  <link href="/static/common/css/toast.css" rel="stylesheet">
  <link href="/static/admin/css/conversation.css?v=0.3.1" rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col" style="background-color: var(--bg);">
  <div id="toast-container" class="toast-container"></div>
  <div id="app-header"></div>

  <main class="space-y-6 flex-1 container mx-auto max-w-5xl px-6 py-8 fade-in">
    <div class="space-y-6">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-2xl font-semibold tracking-tight">会话管理</h2>
          <p class="text-[var(--accents-4)] mt-1 text-sm">查看会话续接状态，支持按会话/Token/过期批量清理。</p>
        </div>
      </div>

      <div class="h-px bg-[var(--border)] my-6"></div>

      <div class="panel flex flex-wrap gap-3 items-end">
        <div class="field">
          <label class="label">Token 过滤</label>
          <input id="filter-token" class="geist-input" placeholder="输入完整 token 过滤">
        </div>
        <div class="flex gap-2">
          <button id="btn-search" class="geist-button-outline">查询</button>
          <button id="btn-reset" class="geist-button-outline">重置</button>
        </div>
        <div class="flex gap-2 ml-auto">
          <button id="btn-clear-expired" class="geist-button-outline">清理过期</button>
          <button id="btn-clear-token" class="geist-button-danger">按 Token 清理</button>
        </div>
      </div>

      <div class="panel">
        <div class="text-xs text-[var(--accents-5)] mb-3" id="summary">共 0 条</div>
        <div class="rounded-lg overflow-hidden bg-white overflow-x-auto">
          <table class="geist-table min-w-[980px]">
            <thead>
              <tr>
                <th class="w-52 text-left">conversation_id</th>
                <th class="w-44 text-left">token</th>
                <th class="w-44 text-left">upstream_conversation_id</th>
                <th class="w-44 text-left">response_id</th>
                <th class="w-44 text-left">share_link_id</th>
                <th class="w-36 text-left">更新时间</th>
                <th class="w-36 text-left">过期时间</th>
                <th class="w-24 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
          <div id="loading" class="text-center py-10 text-[var(--accents-4)]">加载中...</div>
          <div id="empty" class="hidden table-empty">暂无会话数据</div>
        </div>

        <div class="pagination-bar mt-3">
          <div id="page-info" class="text-xs text-[var(--accents-5)]">第 0 / 0 页 · 共 0 条</div>
          <div class="flex items-center gap-2">
            <button id="btn-prev" class="geist-button-outline text-xs px-3">上一页</button>
            <button id="btn-next" class="geist-button-outline text-xs px-3">下一页</button>
            <select id="page-size" class="geist-input h-[30px]">
              <option value="20">20 / 页</option>
              <option value="50" selected>50 / 页</option>
              <option value="100">100 / 页</option>
              <option value="200">200 / 页</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/static/common/js/admin-auth.js?v=0.3.1"></script>
  <script src="/static/common/js/header.js?v=0.3.1"></script>
  <script src="/static/common/js/footer.js?v=0.3.1"></script>
  <script src="/static/common/js/toast.js"></script>
  <script src="/static/admin/js/conversation.js?v=0.3.1"></script>
</body>

</html>
